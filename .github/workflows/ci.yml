name: ci
on:
  push:
    paths: ['rtl/**', 'tb/**', 'scripts/**', 'asic/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: RTL simulation (exhaustive + directed + random, self-checking)
        run: bash scripts/sim.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sim-log, path: build/sim.log }

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys && mkdir -p build
      - name: "Formal: unbounded k-induction, multiplier abstracted (equiv_induct.ys)"
        run: |
          yosys -q -l build/equiv_induct.log -s scripts/equiv_induct.ys
          grep 'Induction step proven: SUCCESS' build/equiv_induct.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: formal-logs, path: build/*.log }

  formal-concrete-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys && mkdir -p build
      - name: "Experiment: Yosys SAT bounded check, concrete RTL, depth 4 (equiv_bmc.ys)"
        run: |
          timeout 20m yosys -q -l build/equiv_bmc.log -s scripts/equiv_bmc.ys
          grep SUCCESS build/equiv_bmc.log
      - name: "Experiment: ABC bmc3 on the concrete miter (AIG)"
        if: always()
        run: |
          yosys -q -l build/aig_prep.log -p "read_verilog -sv rtl/mac_baseline.sv rtl/mac_opiso.sv; proc; miter -equiv -flatten mac_baseline mac_opiso miter; hierarchy -top miter; flatten; opt_clean; dffunmap; techmap; opt -fast; setundef -zero -init; aigmap; opt_clean; stat; write_aiger -zinit build/miter.aig"
          yosys-abc -c "read_aiger build/miter.aig; print_stats; bmc3 -F 16 -T 1200 -v" | tee build/abc_bmc3.log
          grep -E 'No output asserted' build/abc_bmc3.log
      - name: "Experiment: ABC pdr on the concrete miter (unbounded)"
        if: always()
        run: |
          yosys-abc -c "read_aiger build/miter.aig; pdr -T 1500" | tee build/abc_pdr.log
          grep -E 'Property proved' build/abc_pdr.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: formal-concrete-logs, path: build/*.log }

  asic:
    needs: sim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q librelane==2.4.13 && sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      # librelane --dockerized calls docker run -it; script provides the pseudo-TTY
      - name: "LibreLane RTL-to-GDSII: mac_baseline (sky130A, sky130_fd_sc_hd)"
        run: script -q -e -c "librelane --dockerized --run-tag ci asic/mac_baseline/config.json" /dev/null
      - name: "LibreLane RTL-to-GDSII: mac_opiso (sky130A, sky130_fd_sc_hd)"
        run: script -q -e -c "librelane --dockerized --run-tag ci asic/mac_opiso/config.json" /dev/null
      - name: Gate-level regression (both final netlists), VCD check, OpenSTA activity-based power
        run: bash scripts/power.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-results
          path: |
            asic/*/runs/ci/final/metrics.json
            asic/*/runs/ci/final/gds/
            asic/*/runs/ci/*-openroad-stapostpnr/summary.rpt
            asic/*/runs/ci/*-openroad-stapostpnr/*ss_100C_1v60/max.rpt
            asic/*/runs/ci/*.log
            build/*.log
            build/*.rpt
